<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Hojas de estilo de OpenLayers y Plugins -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* Estilos de Controles de OpenLayers */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Buscador por ROL */
        #rol-search-container {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 240px;
        }
        #rol-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        #rol-search-results {
            list-style: none;
            margin: 4px 0 0 0;
            padding: 0;
            max-height: 180px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            display: none;
        }
        #rol-search-results li {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }
        #rol-search-results li:hover {
            background-color: #f0f0f0;
            color: #0078d7;
        }

        /* Ventana Emergente (Popup) */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 200px;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .ol-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }
        .ol-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 4px;
            right: 8px;
            color: #888;
            font-size: 14px;
        }
        .ol-popup-closer:after {
            content: "✖";
        }

        /* Coordenadas en tiempo real */
        .custom-mouse-position {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 12px;
            font-family: monospace;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        </style>
        <title>Visor WebGIS</title>
    </head>
    <body>
        <div id="map">
            <!-- Buscador por ROL -->
            <div id="rol-search-container">
                <input type="text" id="rol-search-input" placeholder="Buscar ROL..." autocomplete="off">
                <ul id="rol-search-results"></ul>
            </div>

            <!-- Coordenadas dinámicas -->
            <div id="mouse-position" class="custom-mouse-position"></div>

            <!-- Pop-up -->
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        
        <!-- Scripts base -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/copiaparavisor_0.js"></script>
        <script src="styles/copiaparavisor_0_style.js"></script>
        <script src="./resources/Autolinker.min.js"></script>

        <!-- Lógica autónoma e integrada del visor -->
        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", function() {
                // 1. Capas Mapas Base
                var lyr_osm = new ol.layer.Tile({
                    'title': 'OpenStreetMap',
                    'type': 'base',
                    'visible': true,
                    source: new ol.source.OSM()
                });

                var lyr_google_sat = new ol.layer.Tile({
                    'title': 'Google Satélite',
                    'type': 'base',
                    'visible': false,
                    source: new ol.source.XYZ({
                        url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'
                    })
                });

                // 2. Estilo Celeste Suave Transparente
                var customCelesteStyle = new ol.style.Style({
                    fill: new ol.style.Fill({
                        color: 'rgba(135, 206, 250, 0.45)'
                    }),
                    stroke: new ol.style.Stroke({
                        color: '#2b8cbe',
                        width: 1.5
                    })
                });

                // 3. Capa Vectorial de Predios
                var format_copiaparavisor_0 = new ol.format.GeoJSON();
                var features_copiaparavisor_0 = format_copiaparavisor_0.readFeatures(json_copiaparavisor_0, 
                    {dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857'});
                var jsonSource_copiaparavisor_0 = new ol.source.Vector({ atts: '' });
                jsonSource_copiaparavisor_0.addFeatures(features_copiaparavisor_0);

                var lyr_copiaparavisor_0 = new ol.layer.Vector({
                    opacity: 1,
                    source: jsonSource_copiaparavisor_0,
                    style: customCelesteStyle,
                    title: 'Predios'
                });

                var layersList = [lyr_osm, lyr_google_sat, lyr_copiaparavisor_0];

                // 4. Coordenadas en Tiempo Real
                var mousePositionControl = new ol.control.MousePosition({
                    coordinateFormat: function(coord) {
                        return ol.coordinate.format(coord, '{y}   {x}', 6);
                    },
                    projection: 'EPSG:4326',
                    target: document.getElementById('mouse-position'),
                    undefinedHTML: 'Sin coordenadas'
                });

                // 5. Inicialización del Mapa
                var map = new ol.Map({
                    target: 'map',
                    controls: ol.control.defaults().extend([mousePositionControl]),
                    layers: layersList,
                    view: new ol.View({
                        center: [0, 0],
                        zoom: 2
                    })
                });

                // Zoom inicial a los predios
                var extent = jsonSource_copiaparavisor_0.getExtent();
                if (!ol.extent.isEmpty(extent)) {
                    map.getView().fit(extent, { padding: [50, 50, 50, 50] });
                }

                // Selector de capas (OpenStreetMap / Google Satélite)
                var layerSwitcher = new ol.control.LayerSwitcher({
                    tipLabel: 'Leyenda y Capas Base'
                });
                map.addControl(layerSwitcher);

                // 6. Overlay Popup
                var container = document.getElementById('popup');
                var content = document.getElementById('popup-content');
                var closer = document.getElementById('popup-closer');

                var overlay = new ol.Overlay({
                    element: container,
                    autoPan: true,
                    autoPanAnimation: { duration: 250 }
                });
                map.addOverlay(overlay);

                closer.onclick = function() {
                    overlay.setPosition(undefined);
                    closer.blur();
                    return false;
                };

                // Lectura flexible del atributo ROL
                function getRolValue(feature) {
                    var props = feature.getProperties();
                    for (var key in props) {
                        if (key.toLowerCase() === 'rol') {
                            return props[key] ? String(props[key]) : 'N/A';
                        }
                    }
                    return 'N/A';
                }

                // Mostrar Popup
                function showFeaturePopup(feature) {
                    var extent = feature.getGeometry().getExtent();
                    var center = ol.extent.getCenter(extent);
                    var lonLat = ol.proj.toLonLat(center);
                    var lat = lonLat[1].toFixed(6);
                    var lon = lonLat[0].toFixed(6);
                    var rol = getRolValue(feature);

                    content.innerHTML = '<strong style="color:#0078d7; font-size:14px;">ROL: ' + rol + '</strong><br>' +
                                        '<span style="font-size:12px; color:#444;">Coordenadas:</span><br>' +
                                        '<code style="background:#f4f4f4; padding:2px 4px; border-radius:3px;">' + lat + '   ' + lon + '</code>';
                    
                    overlay.setPosition(center);
                }

                // Clic sobre una propiedad
                map.on('singleclick', function(evt) {
                    var featureFound = false;
                    map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
                        if (layer === lyr_copiaparavisor_0 && !featureFound) {
                            showFeaturePopup(feature);
                            featureFound = true;
                        }
                    });
                    if (!featureFound) {
                        overlay.setPosition(undefined);
                    }
                });

                // 7. Buscador por ROL
                var searchInput = document.getElementById('rol-search-input');
                var resultsList = document.getElementById('rol-search-results');
                var features = jsonSource_copiaparavisor_0.getFeatures();

                searchInput.addEventListener('input', function() {
                    var query = searchInput.value.trim().toLowerCase();
                    resultsList.innerHTML = '';

                    if (query.length === 0) {
                        resultsList.style.display = 'none';
                        return;
                    }

                    var matches = features.filter(function(feature) {
                        return getRolValue(feature).toLowerCase().includes(query);
                    });

                    if (matches.length > 0) {
                        resultsList.style.display = 'block';
                        matches.slice(0, 10).forEach(function(feature) {
                            var rolVal = getRolValue(feature);
                            var li = document.createElement('li');
                            li.textContent = 'ROL: ' + rolVal;
                            li.addEventListener('click', function() {
                                searchInput.value = rolVal;
                                resultsList.style.display = 'none';
                                var featureExtent = feature.getGeometry().getExtent();
                                map.getView().fit(featureExtent, { duration: 1000, maxZoom: 19, padding: [80, 80, 80, 80] });
                                showFeaturePopup(feature);
                            });
                            resultsList.appendChild(li);
                        });
                    } else {
                        resultsList.style.display = 'block';
                        var li = document.createElement('li');
                        li.textContent = 'Sin resultados';
                        li.style.color = '#888';
                        resultsList.appendChild(li);
                    }
                });

                document.addEventListener('click', function(e) {
                    if (!document.getElementById('rol-search-container').contains(e.target)) {
                        resultsList.style.display = 'none';
                    }
                });
            });
        </script>
    </body>
</html>

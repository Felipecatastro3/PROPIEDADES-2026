<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Widget del Buscador */
        #rol-search-container {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 240px;
        }
        #rol-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        #rol-search-results {
            list-style: none;
            margin: 4px 0 0 0;
            padding: 0;
            max-height: 180px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            display: none;
        }
        #rol-search-results li {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }
        #rol-search-results li:hover {
            background-color: #f0f0f0;
            color: #0078d7;
        }

        /* Coordenadas dinámicas */
        .custom-mouse-position {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 12px;
            font-family: monospace;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* Pop-up flotante */
        .custom-ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 180px;
        }
        .custom-ol-popup:after, .custom-ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .custom-ol-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }
        .custom-ol-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
        .custom-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 4px;
            right: 8px;
            color: #888;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        </style>
        <title>Visor WebGIS</title>
    </head>
    <body>
        <div id="map">
            <!-- Widget de búsqueda -->
            <div id="rol-search-container">
                <input type="text" id="rol-search-input" placeholder="Buscar ROL y presionar Enter..." autocomplete="off">
                <ul id="rol-search-results"></ul>
            </div>

            <!-- Coordenadas del mouse -->
            <div id="mouse-position" class="custom-mouse-position"></div>

            <!-- Ventana emergente (Popup) -->
            <div id="custom-popup" class="custom-ol-popup">
                <span id="custom-popup-closer" class="custom-popup-closer">✖</span>
                <div id="custom-popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/copiaparavisor_0.js"></script>
        <script src="styles/copiaparavisor_0_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script type="text/javascript">
            window.addEventListener('load', function () {
                if (typeof map === 'undefined') return;

                // 1. Quitar relleno y dejar únicamente el contorno azul
                if (typeof lyr_copiaparavisor_0 !== 'undefined') {
                    lyr_copiaparavisor_0.setStyle(new ol.style.Style({
                        fill: null,
                        stroke: new ol.style.Stroke({
                            color: '#2b8cbe',
                            width: 2
                        })
                    }));
                }

                // 2. Leyenda / Control para alternar Mapas Base (OSM y Google Satélite)
                var layerSwitcher = new ol.control.LayerSwitcher({
                    tipLabel: 'Leyenda de Capas Base'
                });
                map.addControl(layerSwitcher);

                // 3. Control de Coordenadas del cursor
                var mousePositionControl = new ol.control.MousePosition({
                    coordinateFormat: function(coord) {
                        return ol.coordinate.format(coord, '{y}   {x}', 6);
                    },
                    projection: 'EPSG:4326',
                    target: document.getElementById('mouse-position'),
                    undefinedHTML: 'Mueva el cursor'
                });
                map.addControl(mousePositionControl);

                // 4. Crear Overlay independiente para el Pop-up
                var popupContainer = document.getElementById('custom-popup');
                var popupContent = document.getElementById('custom-popup-content');
                var popupCloser = document.getElementById('custom-popup-closer');

                var customOverlay = new ol.Overlay({
                    element: popupContainer,
                    autoPan: true,
                    autoPanAnimation: { duration: 250 }
                });
                map.addOverlay(customOverlay);

                popupCloser.onclick = function() {
                    customOverlay.setPosition(undefined);
                    return false;
                };

                // 5. Lógica para extraer la propiedad ROL
                function getRolFromFeature(feature) {
                    var props = feature.getProperties();
                    for (var key in props) {
                        if (key.toLowerCase() === 'rol') {
                            return props[key] ? String(props[key]) : '';
                        }
                    }
                    return '';
                }

                // 6. Desplegar emergente en el centro de la propiedad
                function showCustomPopup(feature, clickCoord) {
                    var geom = feature.getGeometry();
                    if (!geom) return;

                    var displayCoord = clickCoord;
                    if (!displayCoord) {
                        var extent = geom.getExtent();
                        displayCoord = ol.extent.getCenter(extent);
                    }

                    var lonLat = ol.proj.toLonLat(displayCoord);
                    var lat = lonLat[1].toFixed(6);
                    var lon = lonLat[0].toFixed(6);
                    var rol = getRolFromFeature(feature) || 'N/A';

                    popupContent.innerHTML = '<strong style="color:#0078d7; font-size:14px;">ROL: ' + rol + '</strong><br>' +
                                             '<span style="font-size:12px; color:#444;">Coordenadas:</span><br>' +
                                             '<code style="background:#f4f4f4; padding:2px 4px; border-radius:3px;">' + lat + '   ' + lon + '</code>';
                    
                    customOverlay.setPosition(displayCoord);
                }

                // Evento Click manual directo sobre cualquier polígono del mapa
                map.on('singleclick', function(evt) {
                    var found = false;
                    map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
                        if ((layer === lyr_copiaparavisor_0 || !layer) && !found) {
                            showCustomPopup(feature, evt.coordinate);
                            found = true;
                        }
                    });
                    if (!found) {
                        customOverlay.setPosition(undefined);
                    }
                });

                // 7. Cargar entidades directamente del GeoJSON para la búsqueda por ROL
                if (typeof json_copiaparavisor_0 !== 'undefined') {
                    var format = new ol.format.GeoJSON();
                    var parsedFeatures = format.readFeatures(json_copiaparavisor_0, {
                        dataProjection: 'EPSG:4326',
                        featureProjection: 'EPSG:3857'
                    });

                    var searchInput = document.getElementById('rol-search-input');
                    var resultsList = document.getElementById('rol-search-results');

                    function executeSearchAndZoom(feature, rolVal) {
                        searchInput.value = rolVal;
                        resultsList.style.display = 'none';

                        var extent = feature.getGeometry().getExtent();
                        
                        map.getView().fit(extent, {
                            duration: 300,
                            maxZoom: 18,
                            padding: [80, 80, 80, 80]
                        });

                        showCustomPopup(feature);
                    }

                    // Sugerencias en vivo
                    searchInput.addEventListener('input', function() {
                        var query = searchInput.value.trim().toLowerCase();
                        resultsList.innerHTML = '';

                        if (query.length === 0) {
                            resultsList.style.display = 'none';
                            return;
                        }

                        var matches = parsedFeatures.filter(function(feature) {
                            var rol = getRolFromFeature(feature).toLowerCase();
                            return rol.includes(query);
                        });

                        if (matches.length > 0) {
                            resultsList.style.display = 'block';
                            matches.slice(0, 10).forEach(function(feature) {
                                var rolVal = getRolFromFeature(feature);
                                var li = document.createElement('li');
                                li.textContent = 'ROL: ' + rolVal;
                                li.addEventListener('click', function() {
                                    executeSearchAndZoom(feature, rolVal);
                                });
                                resultsList.appendChild(li);
                            });
                        } else {
                            resultsList.style.display = 'block';
                            var li = document.createElement('li');
                            li.textContent = 'Sin resultados';
                            li.style.color = '#888';
                            resultsList.appendChild(li);
                        }
                    });

                    // Tecla ENTER
                    searchInput.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            var query = searchInput.value.trim().toLowerCase();
                            if (query.length === 0) return;

                            var match = parsedFeatures.find(function(feature) {
                                return getRolFromFeature(feature).toLowerCase() === query;
                            });

                            if (!match) {
                                match = parsedFeatures.find(function(feature) {
                                    return getRolFromFeature(feature).toLowerCase().includes(query);
                                });
                            }

                            if (match) {
                                executeSearchAndZoom(match, getRolFromFeature(match));
                            }
                        }
                    });

                    document.addEventListener('click', function(e) {
                        if (!document.getElementById('rol-search-container').contains(e.target)) {
                            resultsList.style.display = 'none';
                        }
                    });
                }
            });
        </script>
    </body>
</html>

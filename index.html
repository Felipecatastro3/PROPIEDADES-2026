<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        /* Panel Lateral Derecho */
        #sidebar {
            width: 320px;
            height: 100%;
            background: #ffffff;
            box-shadow: -2px 0 12px rgba(0,0,0,0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 20px 16px;
            gap: 16px;
            overflow-y: auto;
        }

        .sidebar-header {
            font-size: 16px;
            font-weight: 700;
            color: #1a252f;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Buscador ROL */
        #rol-search-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }

        #rol-search-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        #rol-search-results {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 160px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #rol-search-results li {
            padding: 9px 12px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f1f3f5;
            color: #212529;
        }

        #rol-search-results li:hover {
            background-color: #e8f4fc;
            color: #2980b9;
            font-weight: 600;
        }

        /* Capas Base y Simbología */
        .base-layer-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .base-layer-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #2c3e50;
            cursor: pointer;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #2c3e50;
        }

        .legend-color-box {
            width: 22px;
            height: 14px;
            border: 2px solid #2b8cbe;
            background-color: transparent;
            border-radius: 3px;
        }

        /* Coordenadas en tiempo real */
        .mouse-position-box {
            background: #ffffff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            min-height: 38px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mouse-position-box .ol-mouse-position {
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 12px !important;
            font-weight: bold !important;
            color: #2c3e50 !important;
            position: static !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            text-align: center;
            width: 100%;
        }

        .ol-zoom {
            top: 15px !important;
            left: 15px !important;
        }

        .layer-switcher {
            display: none !important;
        }

        /* Pop-up flotante con Recuadro Estilizado */
        .custom-ol-popup {
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            padding: 14px 16px 12px 16px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            border-top: 4px solid #2b8cbe;
            bottom: 15px;
            left: -50px;
            min-width: 210px;
            z-index: 2500;
        }
        .custom-ol-popup:after, .custom-ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .custom-ol-popup:after {
            border-top-color: #ffffff;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }
        .custom-ol-popup:before {
            border-top-color: #dcdfe6;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
        .custom-popup-pin {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .custom-popup-pin:hover {
            transform: scale(1.2);
        }
        </style>
        <title>Visor WebGIS</title>
    </head>
    <body>
        <div id="app-container">
            <div id="map">
                <div id="custom-popup" class="custom-ol-popup">
                    <span id="custom-popup-pin" class="custom-popup-pin" title="Coordenadas prediales">📍</span>
                    <div id="custom-popup-content"></div>
                </div>
            </div>

            <!-- Panel Lateral Derecho -->
            <div id="sidebar">
                <div class="sidebar-header">Visor Predial</div>

                <!-- 1. Búsqueda por ROL -->
                <div class="menu-section">
                    <div class="section-title">Búsqueda por ROL</div>
                    <input type="text" id="rol-search-input" placeholder="Buscar ROL y presionar Enter..." autocomplete="off">
                    <ul id="rol-search-results"></ul>
                </div>

                <!-- 2. Capas Base -->
                <div class="menu-section">
                    <div class="section-title">Mapa Base</div>
                    <div class="base-layer-options">
                        <label class="base-layer-option">
                            <input type="radio" name="basemap" id="radio-osm" checked>
                            <span>OpenStreetMap</span>
                        </label>
                        <label class="base-layer-option">
                            <input type="radio" name="basemap" id="radio-google">
                            <span>Google Satélite</span>
                        </label>
                    </div>
                </div>

                <!-- 3. Simbología -->
                <div class="menu-section">
                    <div class="section-title">Simbología</div>
                    <div class="legend-item">
                        <div class="legend-color-box"></div>
                        <span>Límite Predial</span>
                    </div>
                </div>

                <!-- 4. Coordenadas del Cursor -->
                <div class="menu-section">
                    <div class="section-title">Coordenadas del Cursor</div>
                    <div class="mouse-position-box">
                        <div id="mouse-position-target"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/copiaparavisor_0.js"></script>
        <script src="styles/copiaparavisor_0_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script type="text/javascript">
            window.addEventListener('load', function () {
                if (typeof map === 'undefined') return;

                setTimeout(function() {
                    map.updateSize();
                }, 100);

                // 1. Selector de Capas Base
                if (typeof lyr_osm !== 'undefined' && typeof lyr_google_sat !== 'undefined') {
                    lyr_osm.setVisible(true);
                    lyr_google_sat.setVisible(false);
                }

                var radioOsm = document.getElementById('radio-osm');
                var radioGoogle = document.getElementById('radio-google');

                if (radioOsm && radioGoogle) {
                    radioOsm.addEventListener('change', function () {
                        if (this.checked && typeof lyr_osm !== 'undefined' && typeof lyr_google_sat !== 'undefined') {
                            lyr_osm.setVisible(true);
                            lyr_google_sat.setVisible(false);
                        }
                    });

                    radioGoogle.addEventListener('change', function () {
                        if (this.checked && typeof lyr_osm !== 'undefined' && typeof lyr_google_sat !== 'undefined') {
                            lyr_osm.setVisible(false);
                            lyr_google_sat.setVisible(true);
                        }
                    });
                }

                // 2. Estilo: Sin relleno visible, sólo borde azul (habilita la captura del clic en el interior)
                var targetLayer = null;
                if (typeof lyr_copiaparavisor_0 !== 'undefined') {
                    targetLayer = lyr_copiaparavisor_0;
                } else if (typeof layersList !== 'undefined' && layersList.length > 2) {
                    targetLayer = layersList[2];
                }

                if (targetLayer) {
                    targetLayer.setVisible(true);
                    targetLayer.setStyle(new ol.style.Style({
                        fill: new ol.style.Fill({
                            color: 'rgba(0, 0, 0, 0)'
                        }),
                        stroke: new ol.style.Stroke({
                            color: '#2b8cbe',
                            width: 2
                        })
                    }));
                }

                // 3. Coordenadas del cursor
                var mousePositionControl = new ol.control.MousePosition({
                    coordinateFormat: function(coord) {
                        return ol.coordinate.format(coord, '{y}   {x}', 6);
                    },
                    projection: 'EPSG:4326',
                    target: document.getElementById('mouse-position-target'),
                    undefinedHTML: 'Mueva el cursor'
                });
                map.addControl(mousePositionControl);

                // 4. Pop-up Overlay
                var popupContainer = document.getElementById('custom-popup');
                var popupContent = document.getElementById('custom-popup-content');
                var popupPin = document.getElementById('custom-popup-pin');

                var customOverlay = new ol.Overlay({
                    element: popupContainer,
                    autoPan: true,
                    autoPanAnimation: { duration: 250 }
                });
                map.addOverlay(customOverlay);

                popupPin.onclick = function() {
                    customOverlay.setPosition(undefined);
                    return false;
                };

                function getRolFromFeature(feature) {
                    var props = feature.getProperties();
                    for (var key in props) {
                        if (key.toLowerCase() === 'rol') {
                            return props[key] ? String(props[key]) : '';
                        }
                    }
                    return '';
                }

                // 5. Pop-up desplegado en el centroide exacto
                function showCustomPopup(feature, clickCoord) {
                    var geom = feature.getGeometry();
                    if (!geom) return;

                    var displayCoord = clickCoord;
                    if (!displayCoord) {
                        var extent = geom.getExtent();
                        displayCoord = ol.extent.getCenter(extent);
                    }

                    var lonLat = ol.proj.toLonLat(displayCoord);
                    var lat = lonLat[1].toFixed(6);
                    var lon = lonLat[0].toFixed(6);
                    var rol = getRolFromFeature(feature) || 'N/A';

                    popupContent.innerHTML = '<div style="font-weight:700; color:#2b8cbe; font-size:14px; margin-bottom:6px; border-bottom:1px solid #f0f0f0; padding-bottom:4px;">ROL: ' + rol + '</div>' +
                                             '<div style="font-size:11px; color:#606266; margin-bottom:3px;">Coordenadas Geográficas:</div>' +
                                             '<div style="background:#f4f4f5; color:#303133; padding:4px 8px; border-radius:4px; font-size:12px; font-family:monospace; font-weight:600; border:1px solid #e4e7ed; text-align:center;">' + lat + '   ' + lon + '</div>';
                    
                    customOverlay.setPosition(displayCoord);
                }

                // Clic directo en cualquier parte del polígono
                map.on('singleclick', function(evt) {
                    var found = false;
                    map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                        if (!found && feature) {
                            showCustomPopup(feature, evt.coordinate);
                            found = true;
                        }
                    });
                    if (!found) {
                        customOverlay.setPosition(undefined);
                    }
                });

                // 6. BÚSQUEDA Y ZOOM DIRECTO AL CENTROIDE DEL PREDIO
                if (typeof json_copiaparavisor_0 !== 'undefined') {
                    var format = new ol.format.GeoJSON();
                    var parsedFeatures = format.readFeatures(json_copiaparavisor_0, {
                        dataProjection: 'EPSG:4326',
                        featureProjection: 'EPSG:3857'
                    });

                    var searchInput = document.getElementById('rol-search-input');
                    var resultsList = document.getElementById('rol-search-results');

                    function executeSearchAndZoom(feature, rolVal) {
                        searchInput.value = rolVal;
                        resultsList.style.display = 'none';

                        var geom = feature.getGeometry();
                        if (geom) {
                            var extent = geom.getExtent();
                            var center = ol.extent.getCenter(extent);
                            var resolution = map.getView().getResolution();

                            // Ajuste exacto de desplazamiento para colocar el predio en el centro visual (compensando el sidebar de 320px)
                            var offsetX = 160 * resolution; 
                            var targetCenter = [center[0] + offsetX, center[1]];

                            // Animación directa al centro del predio con Zoom 18
                            map.getView().animate({
                                center: targetCenter,
                                zoom: 18,
                                duration: 400
                            });

                            showCustomPopup(feature, center);
                        }
                    }

                    searchInput.addEventListener('input', function() {
                        var query = searchInput.value.trim().toLowerCase();
                        resultsList.innerHTML = '';

                        if (query.length === 0) {
                            resultsList.style.display = 'none';
                            return;
                        }

                        var matches = parsedFeatures.filter(function(feature) {
                            var rol = getRolFromFeature(feature).toLowerCase();
                            return rol.includes(query);
                        });

                        if (matches.length > 0) {
                            resultsList.style.display = 'block';
                            matches.slice(0, 10).forEach(function(feature) {
                                var rolVal = getRolFromFeature(feature);
                                var li = document.createElement('li');
                                li.textContent = 'ROL: ' + rolVal;
                                li.addEventListener('click', function() {
                                    executeSearchAndZoom(feature, rolVal);
                                });
                                resultsList.appendChild(li);
                            });
                        } else {
                            resultsList.style.display = 'block';
                            var li = document.createElement('li');
                            li.textContent = 'Sin resultados';
                            li.style.color = '#909399';
                            resultsList.appendChild(li);
                        }
                    });

                    searchInput.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            var query = searchInput.value.trim().toLowerCase();
                            if (query.length === 0) return;

                            var match = parsedFeatures.find(function(feature) {
                                return getRolFromFeature(feature).toLowerCase() === query;
                            });

                            if (!match) {
                                match = parsedFeatures.find(function(feature) {
                                    return getRolFromFeature(feature).toLowerCase().includes(query);
                                });
                            }

                            if (match) {
                                executeSearchAndZoom(match, getRolFromFeature(match));
                            }
                        }
                    });

                    document.addEventListener('click', function(e) {
                        if (!document.getElementById('sidebar').contains(e.target)) {
                            resultsList.style.display = 'none';
                        }
                    });
                }
            });
        </script>
    </body>
</html>

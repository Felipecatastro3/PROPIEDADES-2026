<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- CSS de OpenLayers y Plugins -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Estilos del Buscador de ROL */
        #rol-search-container {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 240px;
        }
        #rol-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        #rol-search-results {
            list-style: none;
            margin: 4px 0 0 0;
            padding: 0;
            max-height: 180px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            display: none;
        }
        #rol-search-results li {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }
        #rol-search-results li:last-child {
            border-bottom: none;
        }
        #rol-search-results li:hover {
            background-color: #f0f0f0;
            color: #0078d7;
        }
        </style>
        <title>Visor WebGIS</title>
    </head>
    <body>
        <div id="map">
            <!-- Widget de Búsqueda de ROL -->
            <div id="rol-search-container">
                <input type="text" id="rol-search-input" placeholder="Buscar ROL..." autocomplete="off">
                <ul id="rol-search-results"></ul>
            </div>

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        
        <!-- Scripts base de qgis2web -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        
        <!-- Capa vectorial de QGIS -->
        <script src="layers/copiaparavisor_0.js"></script>
        <script src="styles/copiaparavisor_0_style.js"></script>
        
        <!-- Configuración de Capas Base, Capa Vectorial e Integración -->
        <script type="text/javascript">
            var wms_layers = [];

            // 1. Capa Base: OpenStreetMap (Visible al inicio)
            var lyr_osm = new ol.layer.Tile({
                'title': 'OpenStreetMap',
                'type': 'base',
                'visible': true,
                source: new ol.source.OSM()
            });

            // 2. Capa Base: Google Satélite (Oculta al inicio para permitir intercambio)
            var lyr_google_sat = new ol.layer.Tile({
                'title': 'Google Satélite',
                'type': 'base',
                'visible': false,
                source: new ol.source.XYZ({
                    url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'
                })
            });

            // 3. Procesamiento de la Capa Vectorial de QGIS (copiaparavisor_0)
            var format_copiaparavisor_0 = new ol.format.GeoJSON();
            var features_copiaparavisor_0 = format_copiaparavisor_0.readFeatures(json_copiaparavisor_0, 
                {dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857'});
            var jsonSource_copiaparavisor_0 = new ol.source.Vector({
                atts: '',
            });
            jsonSource_copiaparavisor_0.addFeatures(features_copiaparavisor_0);

            var lyr_copiaparavisor_0 = new ol.layer.Vector({
                opacity: 1,
                vectorAsImage: false,
                source: jsonSource_copiaparavisor_0,
                style: style_copiaparavisor_0,
                popuplayertitle: 'copiaparavisor',
                interactive: true,
                title: '<img src="styles/legend/copiaparavisor_0.png" /> copiaparavisor'
            });

            lyr_copiaparavisor_0.setVisible(true);

            // Lista de capas del mapa
            var layersList = [lyr_osm, lyr_google_sat, lyr_copiaparavisor_0];

            // Configuración de los atributos para las ventanas emergentes (Popups)
            var fieldAliases = {};
            var fieldImages = {};
            var fieldLabels = {};

            if (typeof json_copiaparavisor_0 !== 'undefined' && json_copiaparavisor_0.features.length > 0) {
                var properties = json_copiaparavisor_0.features[0].properties;
                for (var key in properties) {
                    fieldAliases[key] = key;
                    fieldImages[key] = 'TextEdit';
                    fieldLabels[key] = 'inline label - visible';
                }
            }

            lyr_copiaparavisor_0.set('fieldAliases', fieldAliases);
            lyr_copiaparavisor_0.set('fieldImages', fieldImages);
            lyr_copiaparavisor_0.set('fieldLabels', fieldLabels);
        </script> 

        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- Lógica de Búsqueda y Zoom por ROL -->
        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", function () {
                var searchInput = document.getElementById('rol-search-input');
                var resultsList = document.getElementById('rol-search-results');

                // Obtener todas las entidades de la capa
                var features = jsonSource_copiaparavisor_0.getFeatures();

                // Función para obtener el valor del campo ROL sin importar mayúsculas/minúsculas
                function getRolValue(feature) {
                    var props = feature.getProperties();
                    for (var key in props) {
                        if (key.toLowerCase() === 'rol') {
                            return props[key] ? String(props[key]) : '';
                        }
                    }
                    return '';
                }

                // Evento al escribir en el campo de búsqueda
                searchInput.addEventListener('input', function () {
                    var query = searchInput.value.trim().toLowerCase();
                    resultsList.innerHTML = '';

                    if (query.length === 0) {
                        resultsList.style.display = 'none';
                        return;
                    }

                    var matches = features.filter(function (feature) {
                        var rolVal = getRolValue(feature).toLowerCase();
                        return rolVal.includes(query);
                    });

                    if (matches.length > 0) {
                        resultsList.style.display = 'block';
                        matches.slice(0, 10).forEach(function (feature) {
                            var rolVal = getRolValue(feature);
                            var li = document.createElement('li');
                            li.textContent = 'ROL: ' + rolVal;
                            li.addEventListener('click', function () {
                                zoomToFeature(feature, rolVal);
                            });
                            resultsList.appendChild(li);
                        });
                    } else {
                        resultsList.style.display = 'block';
                        var li = document.createElement('li');
                        li.textContent = 'Sin resultados';
                        li.style.cursor = 'default';
                        li.style.color = '#888';
                        resultsList.appendChild(li);
                    }
                });

                // Zoom al elemento seleccionado
                function zoomToFeature(feature, rolVal) {
                    searchInput.value = rolVal;
                    resultsList.style.display = 'none';

                    var extent = feature.getGeometry().getExtent();
                    map.getView().fit(extent, {
                        duration: 1000,
                        maxZoom: 19,
                        padding: [50, 50, 50, 50]
                    });
                }

                // Ocultar resultados al hacer clic fuera del buscador
                document.addEventListener('click', function (e) {
                    if (!document.getElementById('rol-search-container').contains(e.target)) {
                        resultsList.style.display = 'none';
                    }
                });
            });
        </script>
    </body>
</html>
